[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-harness"
version = "1.0.0"
description = "Forge: a persistent local runtime for reliable AI coding agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.38",
  "openai>=1.40",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "pytest>=8.0",
  "langfuse>=3.0",
  "ruff>=0.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.9",
]

[project.scripts]
forge = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
